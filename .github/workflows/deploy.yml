name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licariao-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ismarsanttana/licariao2026' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar código
        run: npm run lint

      - name: Gerar site estático
        run: npm run build

      - name: Publicar no Worker do Licarião
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure o segredo CLOUDFLARE_API_TOKEN no repositório."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure o segredo CLOUDFLARE_ACCOUNT_ID no repositório."; exit 1; }
          node -e 'const token = process.env.CLOUDFLARE_API_TOKEN; if (!/^(?:cfat_[A-Za-z0-9_-]{40,64}|[A-Za-z0-9_-]{40})$/.test(token)) { console.error("O segredo CLOUDFLARE_API_TOKEN não está no formato de um token de API da conta. Revise o valor salvo."); process.exit(1); }'
          npx --yes wrangler@4.131.1 deploy --name hebert-licariao

<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <!-- Add some random connection lines for 'network' feel -->
  <path d="M0 0 L20 20 M40 0 L60 20 M80 0 L100 20" stroke="#bae6fd" stroke-width="0.5" opacity="0.3"/>
  <circle cx="20" cy="20" r="1.5" fill="#3b82f6" opacity="0.2"/>
  <circle cx="60" cy="20" r="1.5" fill="#3b82f6" opacity="0.2"/>
  <circle cx="100" cy="20" r="1.5" fill="#3b82f6" opacity="0.2"/>
</svg>
